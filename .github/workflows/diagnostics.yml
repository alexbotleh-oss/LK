name: B77 diagnostics

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  project-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Project diagnostic
        run: python scripts/project_diagnostic.py
